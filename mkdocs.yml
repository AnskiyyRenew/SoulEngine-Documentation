site_name: SoulEngine Documentation (2.5.3)
site_url: https://anskiyyrenew.github.io/SoulEngine-Documentation/
theme:
  name: material
  language: zh
  palette:
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: deep purple
    accent: purple
    toggle:
      icon: material/weather-night
      name: Switch to light mode
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: deep purple
    accent: purple
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  code:
    highlight_theme: dracula
  features:
  - navigation.indexes
extra_css:
- css/custom.css
use_directory_urls: true
markdown_extensions:
- admonition
- toc:
    permalink: true
- pymdownx.highlight
- pymdownx.superfences
- pymdownx.inlinehilite
plugins:
- search
- i18n:
    reconfigure_material: true
    docs_structure: folder
    fallback_to_default: true
    languages:
    - locale: zh
      name: 中文
      default: true
      build: true
      link: /
      nav:
      - 首页: index.md
      - 入门部分:
        - 入门指南: 1.入门部分/1.md
        - 基础知识: 1.入门部分/2.md
        - 开发过程的注意事项: 1.入门部分/3.md
      - 基础开发:
