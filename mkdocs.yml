site_name: SoulEngine Documentation (3.0.0)
site_url: https://anskiyyrenew.github.io/SoulEngine-Documentation/
theme:
  name: material
  language: en
  palette:
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: deep purple
    accent: purple
    toggle:
      icon: material/weather-night
      name: Switch to light mode
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: deep purple
    accent: purple
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  code:
    highlight_theme: monokai
  features:
  - navigation.indexes
  # Built-in "copy to clipboard" button on every code block (no custom JS needed).
  - content.code.copy
extra_css:
- css/custom.css
# Removes the language-wrapper section (e.g. "zh CN") from the auto-detected
# nav for underscore locales like zh_CN. See hooks.py for details.
hooks:
- hooks.py
use_directory_urls: true
markdown_extensions:
- admonition
# Enables collapsible admonitions: ??? (collapsed by default) / ???+ (expanded).
- pymdownx.details
- toc:
    permalink: true
- pymdownx.highlight
- pymdownx.superfences
- pymdownx.inlinehilite

# NOTE: No explicit `nav:` is defined here — the navigation is auto-detected
# from each language folder's directory structure.
#
# Folder display names are defined by a `.pages` file in each section folder
# (via `title:`), e.g. docs/en/010_getting_started/.pages -> title: Getting Started.
plugins:
- awesome-pages
- search:
    lang:
    - zh
    - en
- i18n:
    docs_structure: folder
    languages:
    - locale: en
      name: English
      default: true
      build: true
    - locale: zh_CN
      name: 简体中文
      build: true
      theme:
        language: zh
